
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walima Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #d8d5ce;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cormorant Garamond', serif;
}

/* Main invitation screen */

.invitation {
    width: 100%;
    max-width: 430px;
    height: 100svh;
    min-height: 600px;
    max-height: 900px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    text-align: center;
    color: #fff5df;

    background:
    radial-gradient(ellipse at 20% 20%, #58745d 0%, transparent 45%),
    radial-gradient(ellipse at 85% 75%, #253e30 0%, transparent 50%),
    linear-gradient(145deg, #102e25, #31513d 50%, #142d24);

    box-shadow: 0 10px 35px #0004;
    animation: pageAppear 1.5s ease both;
}

@keyframes pageAppear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Decorative garden lights */

.invitation::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
    radial-gradient(circle at 15% 12%, #d8c89b38 0 2px, transparent 4px),
    radial-gradient(circle at 85% 20%, #e3d3a044 0 3px, transparent 5px),
    radial-gradient(circle at 12% 75%, #e3d3a044 0 2px, transparent 5px),
    radial-gradient(circle at 90% 88%, #e3d3a044 0 3px, transparent 5px),
    linear-gradient(90deg, #0003, transparent 20%, transparent 80%, #0003);
}

/* Golden border */

.border {
    position: absolute;
    inset: 13px;
    border: 1px solid #d5bd80;
    border-radius: 5px;
    pointer-events: none;
}

.border::before {
    content: "✧";
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #234432;
    padding: 0 12px;
    color: #e7d3a0;
    font-size: 22px;
}

/* Leaves decoration */

.leaf {
    position: absolute;
    font-size: 65px;
    opacity: .32;
    color: #c4b47c;
    pointer-events: none;
}

.leaf.one {
    top: 4%;
    left: -12px;
    transform: rotate(-35deg);
}

.leaf.two {
    top: 34%;
    right: -15px;
    transform: rotate(45deg);
}

.leaf.three {
    bottom: 5%;
    left: -12px;
    transform: rotate(35deg);
}

.content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 22px 35px;
}

/* Initials frame */

.monogram {
    width: 91px;
    height: 112px;
    border: 2px solid #dfc994;
    outline: 1px solid #dfc994;
    outline-offset: 5px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    margin-bottom: 32px;
    background: #e9e0ce0d;
    color: #f4dfae;
    font-family: 'Great Vibes', cursive;
    font-size: 29px;
    line-height: 1.05;
    text-shadow: 0 2px 5px #0005;
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 5px #d6c18b44; }
    to { box-shadow: 0 0 22px #e3cf9b66; }
}

.small-text {
    font-family: 'Great Vibes', cursive;
    font-size: 22px;
    margin-bottom: 7px;
    color: #e8d6ae;
}

.heading {
    font-size: 35px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #f3e5c8;
}

.subtitle {
    font-family: 'Great Vibes', cursive;
    font-size: 21px;
    margin-top: 9px;
    color: #e9d7b0;
}

/* Envelope */

.envelope-area {
    margin-top: auto;
    margin-bottom: auto;
    width: 100%;
    display: flex;
    justify-content: center;
    perspective: 1000px;
}

.envelope {
    width: min(78%, 290px);
    height: 180px;
    position: relative;
    cursor: pointer;
    filter: drop-shadow(0 13px 14px #0005);
    transition: transform .5s ease;
}

.envelope:hover {
    transform: translateY(-5px);
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(140deg, #f6efdf, #d9cbb0);
    border: 1px solid #c8b58c;
    border-radius: 3px;
    overflow: hidden;
}

.envelope-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
    repeating-linear-gradient(45deg, transparent 0 5px, #b9a98918 6px 7px);
}

.envelope-body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, transparent 49%, #b8a78466 50%, transparent 51%),
                linear-gradient(215deg, transparent 49%, #b8a78466 50%, transparent 51%);
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: linear-gradient(145deg, #fff8e9, #dfd1b7);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1.1s ease;
    z-index: 5;
    border-top: 1px solid #c6b38d;
    backface-visibility: visible;
}

.seal {
    position: absolute;
    z-index: 7;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    width: 43px;
    height: 43px;
    border-radius: 50%;
    background: radial-gradient(circle, #d6bd80, #9c7d43);
    border: 2px solid #f1dfb3;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Great Vibes', cursive;
    font-size: 23px;
    color:  rgb(2, 56, 2);
    transition: opacity .5s, transform .5s;
}

/* Hidden message inside envelope */

.letter {
    position: absolute;
    bottom: 8px;
    left: 8%;
    width: 84%;
    height: 140px;
    background: #fff9eb;
    color: #31503c;
    padding: 15px 5px;
    z-index: 2;
    opacity: 0;
    transition: all 1s ease;
    font-family: 'Great Vibes', cursive;
    font-size: 24px;
}

/* Envelope opening */

.envelope.open .flap {
    transform: rotateX(180deg);
    z-index: 1;
}

.envelope.open .seal {
    opacity: 0;
    transform: translateX(-50%) scale(.4);
}

.envelope.open .letter {
    opacity: 1;
    transform: translateY(-95px);
    transition-delay: .4s;
}

.envelope.open {
    transform: translateY(20px);
}

/* Bottom text */

.tap-text {
    font-family: 'Great Vibes', cursive;
    font-size: 25px;
    color: #f2dfb9;
    margin-bottom: 12px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { opacity: .55; }
}

/* Next page button */

.next-page {
    display: inline-block;
    text-decoration: none;
    color: #234331;
    background: linear-gradient(135deg, #f5e6c5, #c7a96d);
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 17px;
    letter-spacing: 2px;
    margin-bottom: 20px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(15px);
    transition: .7s ease;
}

.next-page.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.footer {
    font-size: 13px;
    letter-spacing: 3px;
    color: #d6c9a8;
}

/* Small phone screens */

@media (max-width: 380px) {
    .content { padding-top: 38px; }
    .monogram { width: 78px; height: 96px; }
    .heading { font-size: 29px; }
    .envelope { height: 155px; }
    .flap { height: 85px; }
    .seal { top: 66px; }
}

@media (min-width: 500px) {
    .invitation {
        border-radius: 13px;
    }
}
</style>
</head>

<body>

<div class="invitation">

    <div class="border"></div>

    <div class="leaf one">❧</div>
    <div class="leaf two">❧</div>
    <div class="leaf three">❧</div>

    <div class="content">

        <div class="monogram">
            W
            <span>&</span>
            W
        </div>

        <p class="small-text">Together with their families</p>

        <h1 class="heading">Walima</h1>

        <p class="subtitle">
            A beautiful beginning of forever
        </p>

        <div class="envelope-area">

            <div class="envelope" id="envelope">

                <div class="envelope-body"></div>

                <div class="letter">
                    With love & blessings
                    <br>
                    You are invited!
                </div>

                <div class="flap"></div>

                <div class="seal">W&W</div>

            </div>

        </div>

        <p class="tap-text" id="tapText">
            Tap to open
        </p>

        <a href="end.html" class="next-page" id="nextPage">
            OPEN INVITATION ✧
        </a>

        <p class="footer">
            WITH LOVE & BLESSINGS
        </p>

    </div>
</div>

<script>

const envelope = document.getElementById("envelope");
const nextPage = document.getElementById("nextPage");
const tapText = document.getElementById("tapText");

envelope.addEventListener("click", function() {

    if (envelope.classList.contains("open")) {
        return;
    }

    envelope.classList.add("open");

    tapText.style.opacity = "0";

    setTimeout(() => {
        nextPage.classList.add("show");
    }, 1400);

});

</script>

</body>
</html>
